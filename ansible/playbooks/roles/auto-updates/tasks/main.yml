---
# Role: auto-updates
# Purpose: Configure automatic updates for Debian system and Docker containers
# Author: Sos
# Date: 2025-10-25

- name: Install unattended-upgrades package
  apt:
    name: unattended-upgrades
    state: present
    update_cache: yes

- name: Configure unattended-upgrades origins
  lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//.*origin.*}-updates";'
    line: '        "origin=Debian,codename=${distro_codename}-updates";'
    state: present

- name: Enable automatic security updates
  lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^//.*origin.*}-security";'
    line: '        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";'
    state: present

- name: Enable automatic Docker updates
  lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    insertafter: 'origin=Debian,codename=\$\{distro_codename\}-security'
    line: '        "origin=Docker";'
    state: present

- name: Create auto-upgrades configuration file
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'
  notify: restart unattended-upgrades

- name: Enable and start unattended-upgrades service
  service:
    name: unattended-upgrades
    enabled: yes
    state: started

# Docker auto-updates with Watchtower
- name: Check if Docker is installed
  command: which docker
  register: docker_installed
  ignore_errors: yes
  changed_when: false

- name: Deploy Watchtower container for Docker auto-updates
  when: docker_installed.rc == 0
  block:
    - name: Create Watchtower .env file with secrets
      copy:
        dest: /DATA/docker/watchtower/.env
        content: |
          WATCHTOWER_NOTIFICATION_URL=ntfy://{{ vault_ntfy_url | regex_replace('^https?://', '') }}/{{ vault_ntfy_topic }}
        mode: '0600'

    - name: Deploy Watchtower with docker-compose
      community.docker.docker_compose_v2:
        project_src: /DATA/docker/watchtower

- name: Create Watchtower log directory
  file:
    path: /var/log/watchtower
    state: directory
    mode: '0755'
  when: docker_installed.rc == 0

- name: Display auto-updates status
  debug:
    msg: |
      Auto-updates configured successfully:
      - System packages: Daily via unattended-upgrades (Debian)
      - Docker Engine: Daily via unattended-upgrades (docker-ce, containerd)
      - Docker containers: Daily at 4 AM via Watchtower
      - Cleanup: Old images removed automatically
